<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Founder Login — VOID.LINK</title><link rel="stylesheet" href="styles.css">
<style>
body{min-height:100vh;background:#050506;color:#f5f3f7;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center}
.auth-shell{width:min(460px,calc(100% - 32px));position:relative}.auth-glow{position:absolute;inset:-120px;background:radial-gradient(circle,rgba(166,108,255,.16),transparent 65%);pointer-events:none}
.auth-card{position:relative;border:1px solid #29262f;background:rgba(12,12,16,.9);backdrop-filter:blur(24px);border-radius:22px;padding:34px;box-shadow:0 35px 100px #000}
.brand{font:700 11px "Space Mono";letter-spacing:.12em;color:#8f8999}.brand b{color:#a66cff}
h1{font-size:42px;line-height:.95;letter-spacing:-.06em;margin:38px 0 12px}p{color:#7f7987;font-size:12px;line-height:1.7}
label{display:block;font:8px "Space Mono";color:#696471;margin:25px 0 9px}
input{width:100%;box-sizing:border-box;background:#09090c;border:1px solid #29262f;color:#fff;border-radius:10px;padding:14px;outline:none}
input:focus{border-color:#a66cff;box-shadow:0 0 0 4px rgba(166,108,255,.08)}
button{width:100%;margin-top:14px;border:0;border-radius:10px;padding:14px;background:#f5f3f7;color:#08080a;font-weight:800;cursor:pointer}
button:hover{transform:translateY(-1px)}.error{min-height:20px;color:#ff7e9e;font-size:11px;margin-top:12px}
.back{display:inline-block;margin-top:25px;color:#9d91aa;font-size:11px}.hint{font-size:10px;color:#5e5965;margin-top:17px}
</style></head><body><main class="auth-shell"><div class="auth-glow"></div><section class="auth-card">
<div class="brand">VOID<span class="brand b">.LINK</span> / FOUNDER</div>
<h1>Create your founder access.</h1><p>This is a one-time setup. Pick a strong password and keep it private.</p>
<form id="login"><label for="password">NEW FOUNDER PASSWORD</label><input id="password" type="password" autocomplete="new-password" minlength="12" required>
<label for="confirm">CONFIRM PASSWORD</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" required>
<button>Create secure founder account ↗</button><div class="error" id="error"></div></form>
<div class="hint">You can change the password later by replacing <code>data/founder.json</code> after stopping the server.</div><a class="back" href="/">← Back to public site</a>
</section></main>
<script>
document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const error=document.querySelector('#error');error.textContent='';const p=document.querySelector('#password').value,c=document.querySelector('#confirm').value;if(p.length<12){error.textContent='Use at least 12 characters.';return}if(p!==c){error.textContent='Passwords do not match.';return}try{const r=await fetch('/api/founder/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});const d=await r.json();if(!r.ok)throw Error(d.error||'Setup failed.');location.href='/founder/dashboard'}catch(err){error.textContent=err.message}});
</script></body></html>
